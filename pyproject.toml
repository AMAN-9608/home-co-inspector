[project]
name = "second-inspector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "meta-sam-parser",
    "openai",
    "uvicorn",
    "websockets",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "secondinspector"
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
